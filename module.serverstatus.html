{% if module.display %}
  <div class="card module server-status {% if module.online %}is-online{% else %}is-offline{% endif %}">
    <span class="online-dot"></span>
    <div>
      <h4>{{ module.ip }}{% if module.port != 25565 %}:{{ module.port }}{% endif %}</h4>
      <p>
        {% if module.online %}{{ module.players.online }} / {{ module.players.max }}{% else %}0/0{% endif %}
        {{ __("players online.") }}
      </p>
    </div>
  </div>
{% endif %}
